<svg width="300" height="100" xmlns="http://www.w3.org/2000/svg"  stroke="#000" stroke-linecap="square" >
  <title>SVG SMIL Animate with transform</title>
  <!-- <rect x="0" y="0" width="300" height="100" stroke="black" stroke-width="1" /> -->
  <path d="M0 0z" stroke-width="999" />
  <path id="rect" d="M40 40  h30 v30 h-30z" fill="blue" >
    <!-- <animateTransform
      attributeName="transform"
      begin="0s"
