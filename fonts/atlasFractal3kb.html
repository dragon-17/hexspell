<body><script>
R=(...x)=>x[~~(Math.random()*x.length)]
F=(o,s,d)=>{
 for(i=d;0<i--;)s=s.flatMap( (x)=> e(x))
 return{g:g(o,s),s};
}

D.width="1000px";r=x=>x.toFixed(2)

d="m${o[0]} ${o[1]} l${s.map(([x,y])=>[r(x),r(y)]).join("l")}z"/></svg>`
p=R([[20,0],[0,20],[-20,0],[0,-20]],[[20,0],[-10,17],[-10,-17]]);

<pre contenteditable style="--landC:${_f};--cC:${_s}"><h2><u>Map of ${n}</u></h2> 
<span hud>[ <u>Help: Use KEYS or Copy&Paste this:</u> Terrain .,_-|\\/'*% <u>Text</u> <b>bbP.</b> <u><i>AA^^</i></u> <i>x X [] () o O</i> <b><i>~~ ~ §$</i></b> <i><b>6^6 </b></i>]</span>

<u hud>Emoji: 🧱✨🐉🐍🧛🐑💎🐫🐘🐬🦕🪸🕊️🐦‍🔥🐧🧟‍♀️🧞‍♀️🦴🪽  🐉&#xFE0E;🐍&#xFE0E;💀&#xFE0E;🐑&#xFE0E;💎&#xFE0E;</u>
${(" ".repeat(100)+"<b hud>.</b>\n").repeat(40)}</pre>
${f.g}</div>`);

this.onkeydown=e=>e.ctrlKey&&e.key=="m"?m(1):1
