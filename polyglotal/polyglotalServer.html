async function nodeCLI() {
    const [http,fs,{text}]= await Promise.all([
        import("http"),import("fs"),import("stream/consumers"),
    ])
    // most compact args parse logic I can think of
    const ARGS = process.argv;
    const param = flag=>ARGS.find((_,i)=>ARGS[i-1]==flag);
    const paramL = (flag,out=[])=>{
        for(let i=ARGS.indexOf(flag); ARGS[i++]&&ARGS[i]?.[0]!=="-";) out.push(ARGS[i]);
        return out;
    }
    
    nodePort = param("-p") ?? nodePort;
    nodeIndex = param("-i") ?? param("--index.html") ?? nodeIndex;
    ACAO = param("-acao") ?? "http:"+nodeHost+":"+nodePort;

    let handler;
    SERVER = http.createServer( async (req, res) => {
        // tell Browser his POST is ok
        res.setHeader('Access-Control-Allow-Origin',ACAO );// use '*' for file:// write
        res.setHeader('Access-Control-Allow-Methods', 'GET,POST,OPTIONS');
        res.setHeader('Access-Control-Allow-Credentials', 'true');
        
        if (req.method === 'OPTIONS'||req.method === 'HEAD') return res.end();

        let file =  req.url.slice(1);
        if(/\.\.|^\/|^\w:/.test(file)){ return res.end("Ok");/*silent abort*/}

        if (req.method === 'GET') {
            req.url === '/' ?  file= nodeIndex  :0;

            const end = file.match(/\.(\w+)$/)?.[1];
            res.setHeader('Content-Type',contentType[end]??"text/plain");
            
            return  fs.readFile(file, (err, data) => {
                if (err) res.statusCode = 404, res.end("404 Not found: "+file);
                else res.end(data);
            });
            
        }
        if (req.method !== 'POST') { res.statusCode = 404; return res.end(); }

        fs.writeFileSync( "./"+file, await text(req));

        console.log(`Save: ${file}`);
        res.end('OK');
    });
    
    SERVER.listen(nodePort, nodeHost);
    console.log('http://'+ nodeHost + ':' + nodePort,`\n\t\x1b[35m==> \x1b[1m\x1b[0muse \x1b[1m\x1b[35mCtrl+C\x1b[0m to stop ...`);
}
